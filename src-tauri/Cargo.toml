[package]
name = "physics-ide"
version = "8.0.0"
edition = "2021"

[lib]
name = "physics_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]

tauri = { version = "2.0.0", features = [] }
# Native opener for file associations
tauri-plugin-opener = "2.0.0"
# Native folder selection browser plugin
tauri-plugin-dialog = "2.0.0"
# Serialization engines for workspace file-tree paths & preference JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
notify = "6.1.1"
aes-gcm = "0.10"
base64 = "0.5"
mime_guess = "2.0"
pbkdf2 = { version = "0.12", features = ["simple"] }
rand = "0.8"
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
